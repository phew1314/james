/* 滾動淡入 */
function Fade({ children, className = "", delay = 0, as: Tag = "div", ...rest }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!("IntersectionObserver" in window)) { el.classList.add("in"); return; }
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) { el.classList.add("in"); io.disconnect(); } });
    }, { threshold: 0.12 });
    io.observe(el);
    const t = setTimeout(() => el.classList.add("in"), 2500);
    return () => { io.disconnect(); clearTimeout(t); };
  }, []);
  return <Tag ref={ref} className={"fade " + className} style={{ transitionDelay: delay + "ms" }} {...rest}>{children}</Tag>;
}

/* 沒有照片時的水彩替代插畫 */
const HUES = {
  sage: ["#c9d6cc", "#8fa597", "#52665A"],
  clay: ["#ecd9c8", "#d2a383", "#B57C58"],
  oat:  ["#e9e3d7", "#c7bba6", "#8c7f6a"],

function Wash({ hue = "sage", id, tall }) {
  const [a, b, c] = HUES[hue];
  const fid = "w" + id;
  return (
    <svg viewBox={tall ? "0 0 300 380" : "0 0 400 300"} preserveAspectRatio="xMidYMid slice" className="absolute inset-0 w-full h-full" aria-hidden="true">
      <defs>
        <filter id={fid} x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed={id * 7 + 3} />
          <feDisplacementMap in="SourceGraphic" scale="14" />
        </filter>
      </defs>
      <rect width="100%" height="100%" fill="#F2EFE9" />
      <g filter={`url(#${fid})`} opacity="0.92">
        <circle cx={tall ? 230 : 330} cy="60" r="34" fill="#efd9b4" />
        <rect x="20" y={tall ? 170 : 120} width="90" height={tall ? 200 : 170} fill={b} opacity=".55" />
        <rect x="120" y={tall ? 140 : 95} width="80" height={tall ? 230 : 200} fill={a} />
        <rect x="210" y={tall ? 180 : 130} width="100" height={tall ? 190 : 170} fill={b} opacity=".4" />
        {[0,1,2].map(i => <rect key={i} x={136} y={(tall ? 160 : 112) + i*38} width="18" height="16" fill="#F9F7F3" opacity=".8" />)}
        {[0,1,2].map(i => <rect key={"r"+i} x={166} y={(tall ? 160 : 112) + i*38} width="18" height="16" fill="#F9F7F3" opacity=".8" />)}
        <ellipse cx={tall ? 70 : 80} cy={tall ? 200 : 150} rx="70" ry="62" fill={c} opacity=".55" />
        <ellipse cx={tall ? 260 : 360} cy={tall ? 230 : 170} rx="64" ry="56" fill={c} opacity=".45" />
        <rect x={tall ? 66 : 76} y={tall ? 240 : 190} width="7" height="90" fill="#6E6A63" opacity=".6" />
        <rect x="0" y={tall ? 330 : 270} width="100%" height="60" fill={b} opacity=".35" />
      </g>
    </svg>
  );
}

function Photo({ src, alt, hue, id, tall, tone, pos }) {
  const [bad, setBad] = useState(false);
  if (!src || bad) return <Wash hue={hue} id={id} tall={tall} />;
  return <img src={src} alt={alt} onError={() => setBad(true)} style={pos ? { objectPosition: pos } : undefined} loading="lazy" className={"absolute inset-0 w-full h-full object-cover " + (tone ? "photo-tone" : "")} />;
}

  const [wants, setWants] = useState([]);
  const [form, setForm] = useState({ name: "", contact: "", msg: "" });
  const [result, setResult] = useState(null);
  const submit = async (e) => {
    e.preventDefault();
    if (!form.name.trim() || !form.contact.trim()) { setResult({ type: "err" }); return; }
    const text = `${t.fName}：${form.name}\n${t.fContact}：${form.contact}\n${wants.map(i => t.want[i]).join("、")}\n${form.msg}`.trim();
    const ok = await copy(text, "form");
    setResult({ type: ok ? "ok" : "manual", text });
  };

  const btn = "inline-flex items-center justify-center min-h-[48px] px-6 rounded-full text-[15px] font-medium transition duration-300";
  const inp = "w-full min-h-[48px] bg-oat border border-line rounded-xl px-4 py-3 text-base text-ink placeholder:text-mute/70 focus:border-sage transition";

  return (
    <div>
      {/* 導覽列 */}
      <header className="sticky top-0 z-30 bg-oat/85 backdrop-blur border-b border-line">
        <div className="max-w-6xl mx-auto px-4 sm:px-8 py-3 flex items-center gap-4">
          <a href="#top" className="mr-auto font-serif leading-tight">
            <span className="text-lg font-bold tracking-wide">{L(CONFIG.name)}</span>
            <span className="text-mute text-sm"> ｜ {lang === "zh" ? "民生敦北加盟店" : "Minsheng–Dunbei"}</span>
          </a>
          <nav className="hidden md:flex gap-7 text-[15px] text-mute">
            {t.nav.map(([id, label]) => <a key={id} href={"#" + id} className="hover:text-ink transition">{label}</a>)}
          </nav>
          <div className="flex rounded-full border border-line overflow-hidden text-sm">
            {["zh", "en"].map(l => (
              <button key={l} onClick={() => setLang(l)} aria-pressed={lang === l}
                className={"min-h-[40px] min-w-[44px] px-3 transition " + (lang === l ? "bg-ink text-oat" : "text-mute hover:text-ink")}>
                {l === "zh" ? "中" : "EN"}
              </button>
            ))}
          </div>
          <a href="#contact" className={btn + " hidden sm:inline-flex !min-h-[40px] !px-5 bg-sage text-oat hover:bg-ink"}>{t.talk}</a>
        </div>
        <nav className="md:hidden flex gap-6 overflow-x-auto px-4 pb-2 text-[15px] text-mute">
          {t.nav.map(([id, label]) => <a key={id} href={"#" + id} className="flex-none py-1">{label}</a>)}
        </nav>
      </header>

      {/* 首屏 */}
      <section id="top" className="max-w-6xl mx-auto px-4 sm:px-8 pt-10 sm:pt-16 pb-14 grid md:grid-cols-[1.15fr_.85fr] gap-10 md:gap-16 items-center">
        <Fade>
          <p className="text-[13px] tracking-[.2em] text-sage font-medium mb-5">{t.eyebrow}</p>
          <h1 className="font-serif font-bold text-[34px] sm:text-[46px] lg:text-[52px] leading-[1.25] tracking-tight" style={{ textWrap: "balance" }}>{t.h1}</h1>
          <p className="mt-6 text-[17px] leading-8 text-mute max-w-xl">{t.sub}</p>
          <div className="mt-8 flex flex-wrap gap-3">
            <a href="#listings" className={btn + " bg-ink text-oat hover:bg-sage hover:-translate-y-0.5"}>{t.btn1}</a>
            <a href="#contact" className={btn + " border border-ink/25 hover:border-sage hover:text-sage hover:-translate-y-0.5"}>{t.btn2}</a>
          </div>
        </Fade>
        <Fade delay={150} className="w-full max-w-sm mx-auto md:max-w-none">
          <figure className="bg-white p-3 sm:p-4 pb-4 rotate-[1.2deg] mount rounded-sm">
            <div className="relative aspect-[4/5] overflow-hidden bg-paper">
              {showReal
                ? <Photo src={CONFIG.portrait.real} alt={L(CONFIG.name)} id={1} tall tone />
                : <Photo src={CONFIG.portrait.watercolor} alt={L(CONFIG.name)} hue="sage" id={1} tall />}
            </div>
            <figcaption className="mt-3 flex items-center justify-between gap-3 text-[13px] text-mute font-serif">
              <span>{caption}</span>
              {hasW && hasR && (
                <span className="flex rounded-full bg-paper p-0.5 font-sans">
                  {[["w", t.tW], ["r", t.tR]].map(([k, lab]) => (
                    <button key={k} onClick={() => setView(k)} aria-pressed={(k === "r") === showReal}
                      className={"min-h-[36px] px-3 rounded-full transition " + (((k === "r") === showReal) ? "bg-white text-ink shadow-sm" : "")}>{lab}</button>
                  ))}
                </span>
              )}
            </figcaption>
          </figure>
        </Fade>
      </section>

      {/* 信任數據帶 */}
      <section className="border-y border-line bg-paper/60">
        <div className="max-w-6xl mx-auto px-4 sm:px-8 grid sm:grid-cols-3 divide-y sm:divide-y-0 sm:divide-x divide-line">
          {t.strip.map(([big, small], i) => (
            <Fade key={i} delay={i * 120} className="py-7 sm:px-8 first:sm:pl-0">
              <div className="font-serif text-[28px] font-bold text-ink">{big}</div>
              <div className="text-sm text-mute mt-1">{small}</div>
            </Fade>
          ))}
        </div>
      </section>

      {/* 關於我 */}
      <section id="about" className="max-w-6xl mx-auto px-4 sm:px-8 py-20 sm:py-28 grid md:grid-cols-12 gap-10 md:gap-14">
        <Fade className="md:col-span-5">
          <blockquote className="font-serif text-[26px] sm:text-[32px] leading-[1.5] font-semibold">
            <span className="block text-clay text-5xl leading-none mb-2" aria-hidden="true">“</span>
            {t.quote1}
          </blockquote>
          <div className="mt-6 h-px w-16 bg-clay" />
          <p className="mt-4 text-sm text-mute">{L(CONFIG.name)}・{L(CONFIG.store)}</p>
        </Fade>
        <Fade className="md:col-span-6 md:col-start-7" delay={120}>
          <h2 className="font-serif text-[28px] sm:text-[34px] font-bold mb-6">{t.aboutH}</h2>
          {t.about.map((p, i) => <p key={i} className="text-[17px] leading-8 text-ink/85 mb-5">{p}</p>)}
        </Fade>
      </section>

      {/* 服務 */}
      <section id="services" className="bg-paper py-20 sm:py-28">
        <div className="max-w-6xl mx-auto px-4 sm:px-8">
          <Fade><h2 className="font-serif text-[28px] sm:text-[34px] font-bold">{t.svcH}</h2></Fade>
          <div className="mt-10 grid md:grid-cols-3 gap-5">
            {t.svc.map(([n, h, p], i) => (
              <Fade key={n} delay={i * 120} className="bg-oat rounded-2xl p-7 border border-line hover:-translate-y-1 hover:border-sage/40 transition duration-300">
                <div className="font-serif text-[40px] text-clay leading-none">{n}</div>
                <h3 className="font-serif text-xl font-bold mt-5 mb-3">{h}</h3>
                <p className="text-[15px] leading-7 text-mute">{p}</p>
              </Fade>
            ))}
          </div>
        </div>
      </section>

      {/* 實績 */}
      <section id="awards" className="max-w-6xl mx-auto px-4 sm:px-8 py-20 sm:py-28">
        <div className="grid md:grid-cols-12 gap-8 md:gap-12 items-end">
          <Fade className="md:col-span-6">
            <h2 className="font-serif text-[28px] sm:text-[34px] font-bold">{t.awardsH}</h2>
            <p className="mt-4 text-mute leading-7 max-w-md">{t.awardsSub}</p>
          </Fade>
          <Fade className="md:col-span-6" delay={120}>
            <div className="flex items-baseline justify-between gap-3 mb-3">
              <span className="text-sm text-mute">{t.chartH}</span>
              <span className="font-serif text-clay font-bold text-lg whitespace-nowrap">{growth}</span>
            </div>
            <div className="space-y-3">
              {QUARTERLY.map((q, i) => (
                <div key={i} className="grid grid-cols-[4.5em_minmax(0,1fr)_5.5em] items-center gap-3 text-sm">
                  <span className="text-mute whitespace-nowrap">{yr(q.label, lang)}</span>
                  <span className="h-3 rounded-full bg-line overflow-hidden">
                    <span className={"block h-full rounded-full " + (i === QUARTERLY.length - 1 ? "bg-sage" : "bg-sage/40")} style={{ width: (q.v / qMax * 100) + "%" }} />
                  </span>
                  <span className="text-right font-medium whitespace-nowrap">{q.v}<span className="text-mute text-xs ml-0.5">{lang === "zh" ? "萬" : "×10k"}</span></span>
                </div>
              ))}
            </div>
          </Fade>
        </div>

        <div className="mt-12 grid md:grid-cols-12 gap-6 md:gap-10 items-start">
          <Fade className="md:col-span-7">
            <button type="button" onClick={() => setBox(0)} className="group block w-full text-left rounded-2xl overflow-hidden bg-paper border border-line">
              <div className="relative aspect-[4/3] overflow-hidden">
                <div className="absolute inset-0 group-hover:scale-[1.02] transition duration-700">
                  <Photo src={AWARDS[0].photo} alt={L(AWARDS[0].title)} id={20} tone hue="clay" pos={AWARDS[0].pos} />
                </div>
              </div>
              <div className="p-5 sm:p-6 flex items-end justify-between gap-4">
                <div>
                  <div className="text-sm text-clay font-medium">{yr(AWARDS[0].year, lang)}</div>
                  <div className="font-serif text-xl sm:text-2xl font-bold leading-snug mt-1">{L(AWARDS[0].title)}</div>
                  <div className="text-mute text-sm mt-1">{L(AWARDS[0].note)}</div>
                </div>
                <span className="text-sm text-sage whitespace-nowrap">{t.view} →</span>
              </div>
            </button>
          </Fade>
          <Fade className="md:col-span-5" delay={120}>
            <ol className="divide-y divide-line border-y border-line">
              {AWARDS.slice(1).map((a, j) => {
                const i = j + 1;
                return (
                  <li key={i}>
                    <button type="button" onClick={() => setBox(i)} className="w-full flex items-center gap-4 py-4 text-left group">
                      <span className="relative flex-none w-16 h-16 rounded-xl overflow-hidden bg-paper">
                        <Photo src={a.photo} alt="" id={20 + i} tone hue="clay" pos={a.pos} />
                      </span>
                      <span className="flex-1">
                        {a.year && <span className="block text-[13px] text-clay font-medium">{yr(a.year, lang)}</span>}
                        <span className="block font-serif font-semibold leading-snug group-hover:text-sage transition">{L(a.title)}</span>
                        <span className="block text-[13px] text-mute">{L(a.note)}</span>
                      </span>
                      <span className="text-mute group-hover:text-sage transition" aria-hidden="true">›</span>
                    </button>
                  </li>
                );
              })}
            </ol>
            <p className="mt-3 text-[13px] text-mute">{t.tapHint}</p>
          </Fade>
        </div>
        <div className="mt-20 grid sm:grid-cols-[minmax(0,260px)_minmax(0,1fr)] gap-8 sm:gap-14 items-center">
          <Fade className="w-full max-w-[260px] mx-auto sm:mx-0">
            <figure className="bg-white p-3 pb-3 -rotate-[1.5deg] mount rounded-sm">
              <div className="relative aspect-[3/4] overflow-hidden rounded-sm">
                <Photo src={QUOTE_PHOTO} alt={L(CONFIG.name)} id={30} tone hue="clay" pos="center 40%" />
              </div>
            </figure>
          </Fade>
          <Fade delay={120}>
            <span className="block text-clay text-5xl leading-none mb-2 font-serif" aria-hidden="true">“</span>
            <p className="font-serif text-[28px] sm:text-[40px] leading-snug font-semibold text-sage">{t.quote2}</p>
            <p className="mt-4 text-mute max-w-md leading-7">{t.quote2note}</p>
          </Fade>
        </div>
      </section>

      {/* 精選物件 */}
      <section id="listings" className="bg-paper py-20 sm:py-28">
        <div className="max-w-6xl mx-auto px-4 sm:px-8">
          <Fade>
            <h2 className="font-serif text-[28px] sm:text-[34px] font-bold">{t.listH}</h2>
            <p className="mt-3 text-mute">{t.listSub}</p>
          </Fade>
          <div className="mt-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {LISTINGS.map((h, i) => (
              <Fade key={i} delay={i * 120} as="article" className="group bg-oat rounded-2xl overflow-hidden border border-line">
                <div className="relative aspect-[4/3] overflow-hidden">
                  <div className="absolute inset-0 group-hover:scale-[1.03] transition duration-700">
                    <Photo src={h.photo} alt={L(h.title)} hue={h.hue} id={40 + i} tone />
                  </div>
                </div>
                <div className="p-6">
                  <div className="flex flex-wrap gap-2 mb-3">
                    {L(h.tags).map(tag => <span key={tag} className="text-[13px] px-3 py-1 rounded-full bg-sage/10 text-sage">{tag}</span>)}
                  </div>
                  <h3 className="font-serif text-xl font-bold">{L(h.title)}</h3>
                  <dl className="mt-4 grid grid-cols-3 text-sm border-t border-line pt-4">
                    <div><dt className="text-mute text-[13px]">{lang === "zh" ? "坪數" : "Size"}</dt><dd className="font-medium whitespace-nowrap">{h.size} {t.ping}</dd></div>
                    <div><dt className="text-mute text-[13px]">{lang === "zh" ? "格局" : "Layout"}</dt><dd className="font-medium">{L(h.layout)}</dd></div>
                    <div className="text-right"><dt className="text-mute text-[13px]">{lang === "zh" ? "總價" : "Price"}</dt><dd className="font-serif font-bold text-clay text-lg whitespace-nowrap">{h.price}<span className="text-xs font-sans text-mute ml-0.5">{t.wan}</span></dd></div>
                  </dl>
                </div>
              </Fade>
            ))}
          </div>
          <p className="mt-6 text-[13px] text-mute">{t.sample}</p>
        </div>
      </section>

      {/* 聯絡 */}
      <section id="contact" className="max-w-6xl mx-auto px-4 sm:px-8 py-20 sm:py-28 grid md:grid-cols-2 gap-12">
        <Fade>
          <h2 className="font-serif text-[26px] sm:text-[32px] leading-[1.5] font-bold">{t.cH}</h2>
          <div className="mt-8 space-y-3">
            <a href={"tel:" + CONFIG.phone.replace(/-/g, "")} className="flex items-center justify-between gap-4 p-5 rounded-2xl bg-ink text-oat hover:bg-sage transition">
              <span><span className="block text-xs opacity-70">{t.phoneLabel}</span><span className="text-xl font-medium whitespace-nowrap">{CONFIG.phone}</span></span>
              <span className="text-sm">{t.call} →</span>
            </a>
            {CONFIG.lineId && (
              <div className="flex items-center justify-between gap-4 p-5 rounded-2xl border border-line">
                <span><span className="block text-xs text-mute">{t.lineLabel}</span><span className="text-xl font-medium">{CONFIG.lineId}</span></span>
                <span className="flex gap-2">
                  <button onClick={() => copy(CONFIG.lineId, "line")} className={btn + " !min-h-[44px] !px-4 border border-line hover:border-sage"}>{flash === "line" ? t.copied : t.copyLine}</button>
                  {CONFIG.lineUrl && <a href={CONFIG.lineUrl} target="_blank" rel="noopener" className={btn + " !min-h-[44px] !px-4 bg-sage text-oat"}>{t.addLine}</a>}
                </span>
              </div>
            )}
            <p className="text-sm text-mute pt-2">{L(CONFIG.address)}</p>
          </div>
        </Fade>
        <Fade delay={120}>
          <form onSubmit={submit} className="bg-paper rounded-2xl p-6 sm:p-8 border border-line" noValidate>
            <h3 className="font-serif text-xl font-bold mb-5">{t.formH}</h3>
            <div className="flex flex-wrap gap-2 mb-5">
              {t.want.map((w, i) => {
                const on = wants.includes(i);
                return (
                  <label key={i} className={"cursor-pointer select-none min-h-[44px] inline-flex items-center gap-2 px-4 rounded-full border transition " + (on ? "bg-sage text-oat border-sage" : "border-line bg-oat hover:border-sage")}>
                    <input id={"want-" + i} type="checkbox" className="sr-only" checked={on} onChange={() => setWants(on ? wants.filter(x => x !== i) : [...wants, i])} />
                    {w}
                  </label>
                );
              })}
            </div>
            <div className="space-y-3">
              <input id="f-name" className={inp} placeholder={t.fName} value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
              <input id="f-contact" className={inp} placeholder={t.fContact} value={form.contact} onChange={e => setForm({ ...form, contact: e.target.value })} />
              <textarea id="f-msg" rows="4" className={inp} placeholder={t.fMsg} value={form.msg} onChange={e => setForm({ ...form, msg: e.target.value })} />
            </div>
            <button type="submit" className={btn + " mt-5 w-full bg-ink text-oat hover:bg-sage"}>{t.send}</button>
            {result && result.type === "err" && <p className="mt-4 text-sm text-clay">{t.need}</p>}
            {result && result.type === "ok" && <p className="mt-4 text-sm text-sage">{t.done}</p>}
            {result && result.type === "manual" && (
              <div className="mt-4 text-sm text-mute">
                <p>{t.doneNoClip}</p>
                <pre className="mt-2 whitespace-pre-wrap bg-oat border border-line rounded-xl p-3 text-ink font-sans">{result.text}</pre>
              </div>
            )}
          </form>
        </Fade>
      </section>

      <footer className="border-t border-line">
        <div className="max-w-6xl mx-auto px-4 sm:px-8 py-8 text-[13px] text-mute flex flex-col sm:flex-row sm:flex-wrap gap-x-8 gap-y-2">
          <span>{t.foot}（{L(CONFIG.group)}）</span>
          <span>{L(CONFIG.address)}</span>
          <span>{t.agent} {CONFIG.agentLicense}</span>
          {CONFIG.brokerLicense && <span>{t.broker} {CONFIG.brokerLicense}</span>}
          <span className="sm:basis-full">{t.note}</span>
        </div>
      </footer>

      {box !== null && (
        <div className="fixed inset-0 z-50 bg-ink/90 flex flex-col" role="dialog" aria-modal="true" aria-label={L(AWARDS[box].title)} onClick={() => setBox(null)}>
          <div className="flex justify-end p-3">
            <button type="button" onClick={() => setBox(null)} className="min-h-[44px] min-w-[44px] rounded-full bg-oat/10 text-oat text-2xl" aria-label={t.close}>×</button>
          </div>
          <div className="flex-1 min-h-0 px-3 flex items-center justify-center" onClick={(e) => e.stopPropagation()}>
            <img src={AWARDS[box].photo} alt={L(AWARDS[box].title)} className="max-h-full max-w-full object-contain rounded-lg photo-tone" />
          </div>
          <div className="p-4 sm:p-6 flex items-center gap-3 text-oat" onClick={(e) => e.stopPropagation()}>
            <button type="button" onClick={() => setBox((box + AWARDS.length - 1) % AWARDS.length)} className="min-h-[44px] min-w-[44px] rounded-full border border-oat/30" aria-label={t.prev}>‹</button>
            <div className="flex-1 text-center">
              <div className="text-sm text-clay">{yr(AWARDS[box].year, lang)}</div>
              <div className="font-serif text-lg font-semibold">{L(AWARDS[box].title)}</div>
              <div className="text-sm text-oat/70">{L(AWARDS[box].note)}</div>
            </div>
            <button type="button" onClick={() => setBox((box + 1) % AWARDS.length)} className="min-h-[44px] min-w-[44px] rounded-full border border-oat/30" aria-label={t.next}>›</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
</script>
</body>
</html>
